name: Update News

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  update-news:

    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Fetch and process news

        run: |

          python3 <<'PY'

          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          import html
          import re
          import hashlib

          from datetime import datetime, timezone
          from difflib import SequenceMatcher


          # --------------------------------------------------
          # CONFIG
          # --------------------------------------------------

          with open("sources.json", "r", encoding="utf-8") as f:
              config = json.load(f)

          sources = config["sources"]


          # --------------------------------------------------
          # TOPIC KEYWORDS
          # --------------------------------------------------

          categories = {

              "politik": [
                  "politik",
                  "regierung",
                  "bundestag",
                  "bundesrat",
                  "minister",
                  "ministerin",
                  "kanzler",
                  "kanzlerin",
                  "wahl",
                  "partei",
                  "gesetz",
                  "koalition",
                  "präsident",
                  "präsidentin",
                  "parlament",
                  "regierungspolitik",
                  "election",
                  "government",
                  "president",
                  "prime minister"
              ],

              "wirtschaft": [
                  "wirtschaft",
                  "unternehmen",
                  "konzern",
                  "aktie",
                  "aktien",
                  "börse",
                  "inflation",
                  "zinsen",
                  "zins",
                  "ezb",
                  "bank",
                  "arbeitsmarkt",
                  "jobs",
                  "gehalt",
                  "industrie",
                  "wirtschaftswachstum",
                  "konjunktur",
                  "finanzen",
                  "business",
                  "economy",
                  "company",
                  "market",
                  "markets",
                  "stocks",
                  "finance"
              ],

              "sport": [
                  "sport",
                  "fußball",
                  "fussball",
                  "bundesliga",
                  "champions league",
                  "europa league",
                  "tennis",
                  "basketball",
                  "handball",
                  "olympia",
                  "olympics",
                  "formel 1",
                  "formula 1",
                  "football",
                  "soccer",
                  "nba",
                  "nfl",
                  "motorsport"
              ],

              "technologie": [
                  "technologie",
                  "technik",
                  "ki",
                  "künstliche intelligenz",
                  "artificial intelligence",
                  "ai",
                  "smartphone",
                  "iphone",
                  "android",
                  "computer",
                  "software",
                  "chip",
                  "chips",
                  "digital",
                  "internet",
                  "google",
                  "microsoft",
                  "apple",
                  "openai",
                  "meta",
                  "technology",
                  "tech",
                  "cyber",
                  "robot",
                  "roboter"
              ],

              "wissenschaft": [
                  "wissenschaft",
                  "forschung",
                  "forscher",
                  "forscherinnen",
                  "studie",
                  "studien",
                  "medizin",
                  "astronomie",
                  "weltraum",
                  "klima",
                  "physik",
                  "biologie",
                  "labor",
                  "science",
                  "research",
                  "study",
                  "space"
              ],

              "gesellschaft": [
                  "gesellschaft",
                  "schule",
                  "bildung",
                  "familie",
                  "gesundheit",
                  "verkehr",
                  "wohnen",
                  "kirche",
                  "kultur",
                  "menschen",
                  "demografie",
                  "society",
                  "education",
                  "health",
                  "social"
              ]
          }


          # --------------------------------------------------
          # REGION KEYWORDS
          # --------------------------------------------------

          local_keywords = [
              "ravensburg",
              "weingarten",
              "baienfurt",
              "baindt",
              "berg",
              "wolpertswende",
              "schlier",
              "bodnegg",
              "grünkraut",
              "gruenkraut",
              "meckenbeuren",
              "tettnang",
              "wangen",
              "leutkirch",
              "bad waldsee",
              "bad waldsee",
              "bad saulgau"
          ]


          regional_keywords = [
              "baden-württemberg",
              "baden-wuerttemberg",
              "baden württemberg",
              "oberschwaben",
              "bodensee",
              "allgäu",
              "allgaeu",
              "friedrichshafen",
              "lindau",
              "konstanz",
              "biberach",
              "sigmaringen",
              "tübingen",
              "tuebingen",
              "ulm",
              "stuttgart"
          ]


          germany_keywords = [
              "deutschland",
              "deutschlands",
              "bundestag",
              "bundesrat",
              "bundesregierung",
              "bundeskanzler",
              "bundeskanzlerin",
              "bundespräsident",
              "bundespräsidentin",
              "berlin",
              "münchen",
              "muenchen",
              "hamburg",
              "köln",
              "koeln",
              "frankfurt",
              "düsseldorf",
              "duesseldorf",
              "dresden",
              "leipzig",
              "nürnberg",
              "nuernberg",
              "hannover",
              "bremen",
              "deutsche",
              "deutscher",
              "deutsches",
              "deutschen",
              "german",
              "germany"
          ]


          turkey_keywords = [
              "türkei",
              "türkiye",
              "turkey",
              "turkish",
              "istanbul",
              "ankara",
              "izmir",
              "erdogan",
              "erdoğan",
              "chp",
              "akp",
              "tbmm"
          ]


          international_keywords = [
              "frankreich",
              "france",
              "paris",
              "spanien",
              "spain",
              "madrid",
              "italien",
              "italy",
              "rome",
              "rom",
              "großbritannien",
              "grossbritannien",
              "united kingdom",
              "uk",
              "london",
              "england",
              "schottland",
              "scotland",
              "usa",
              "us",
              "united states",
              "amerika",
              "america",
              "washington",
              "new york",
              "china",
              "chinese",
              "peking",
              "beijing",
              "japan",
              "tokio",
              "tokyo",
              "indien",
              "india",
              "russland",
              "russia",
              "ukraine",
              "ukrain",
              "polen",
              "poland",
              "warschau",
              "warsaw",
              "europa",
              "europe",
              "brüssel",
              "bruessel",
              "brussels",
              "israel",
              "gaza",
              "iran",
              "irak",
              "iraq",
              "nahost",
              "middle east",
              "welt",
              "world",
              "international",
              "global"
          ]


          # --------------------------------------------------
          # CLEAN TEXT
          # --------------------------------------------------

          def clean_text(value):

              if not value:
                  return ""

              value = html.unescape(value)

              value = re.sub(
                  r"<[^>]+>",
                  " ",
                  value
              )

              value = re.sub(
                  r"\s+",
                  " ",
                  value
              )

              return value.strip()


          # --------------------------------------------------
          # SHORT SUMMARY
          # --------------------------------------------------

          def make_summary(text):

              text = clean_text(text)

              if not text:
                  return ""

              sentences = re.split(
                  r"(?<=[.!?])\s+",
                  text
              )

              sentences = [
                  s.strip()
                  for s in sentences
                  if s.strip()
              ]

              summary = " ".join(
                  sentences[:2]
              )

              words = summary.split()

              if len(words) > 55:

                  summary = " ".join(
                      words[:55]
                  )

                  summary += "…"

              return summary


          # --------------------------------------------------
          # TOPIC CLASSIFICATION
          # --------------------------------------------------

          def classify_topic(title, description, source_topics):

              text = (
                  title + " " + description
              ).lower()

              scores = {}

              for category, words in categories.items():

                  score = 0

                  for word in words:

                      if word.lower() in text:
                          score += 1

                  scores[category] = score


              best = max(
                  scores,
                  key=scores.get
              )


              if scores[best] > 0:
                  return best


              if source_topics:
                  return source_topics[0]


              return "gesellschaft"


          # --------------------------------------------------
          # SOURCE DEFAULT REGION
          # --------------------------------------------------

          def source_default_region(source):

              name = source.get(
                  "name",
                  ""
              ).lower()

              regions = source.get(
                  "regions",
                  []
              )


              # Turkey sources
              if (
                  "trt" in name
                  or "ensonhaber" in name
              ):
                  return "turkey"


              # International sources
              if (
                  "bbc" in name
                  or "reuters" in name
                  or "international" in name
              ):
                  return "international"


              # Local / regional sources
              if "dasding" in name:
                  return "regional"


              if "schwäbische" in name:
                  return "regional"


              # Otherwise use configured source region
              if regions:

                  return regions[0]


              return "international"


          # --------------------------------------------------
          # REGION CLASSIFICATION
          # --------------------------------------------------

          def classify_region(
              title,
              description,
              source
          ):

              text = (
                  title + " " + description
              ).lower()


              default_region = source_default_region(
                  source
              )


              # ------------------------------------------
              # 1. VERY LOCAL
              # ------------------------------------------

              if any(
                  keyword in text
                  for keyword in local_keywords
              ):

                  return "local"


              # ------------------------------------------
              # 2. REGIONAL
              # ------------------------------------------

              if any(
                  keyword in text
                  for keyword in regional_keywords
              ):

                  return "regional"


              # ------------------------------------------
              # 3. TURKEY
              # ------------------------------------------

              if any(
                  keyword in text
                  for keyword in turkey_keywords
              ):

                  return "turkey"


              # ------------------------------------------
              # 4. INTERNATIONAL
              #
              # Important:
              # foreign country references override
              # German source origin.
              # ------------------------------------------

              if any(
                  keyword in text
                  for keyword in international_keywords
              ):

                  return "international"


              # ------------------------------------------
              # 5. GERMANY
              # ------------------------------------------

              if any(
                  keyword in text
                  for keyword in germany_keywords
              ):

                  return "germany"


              # ------------------------------------------
              # 6. FALLBACK
              # ------------------------------------------

              return default_region


          # --------------------------------------------------
          # NORMALIZE TITLE
          # --------------------------------------------------

          def normalize_title(title):

              text = title.lower()

              text = re.sub(
                  r"[^a-z0-9äöüß ]",
                  " ",
                  text
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              stopwords = {
                  "der",
                  "die",
                  "das",
                  "den",
                  "dem",
                  "des",
                  "ein",
                  "eine",
                  "einer",
                  "einem",
                  "einen",
                  "und",
                  "oder",
                  "the",
                  "a",
                  "an",
                  "and",
                  "of",
                  "to",
                  "in",
                  "on",
                  "for"
              }

              words = [
                  word
                  for word in text.split()
                  if word not in stopwords
                  and len(word) > 2
              ]

              return " ".join(words)


          # --------------------------------------------------
          # SIMILARITY
          # --------------------------------------------------

          def similar_titles(a, b):

              a = normalize_title(a)
              b = normalize_title(b)

              if not a or not b:
                  return False


              ratio = SequenceMatcher(
                  None,
                  a,
                  b
              ).ratio()


              a_words = set(
                  a.split()
              )

              b_words = set(
                  b.split()
              )


              if not a_words or not b_words:
                  return False


              overlap = len(
                  a_words & b_words
              ) / max(
                  len(a_words | b_words),
                  1
              )


              return (
                  ratio >= 0.62
                  or overlap >= 0.45
              )


          # --------------------------------------------------
          # FETCH RSS
          # --------------------------------------------------

          articles = []


          for source in sources:

              url = source["url"]

              print(
                  "Fetching:",
                  source["name"]
              )


              try:

                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent":
                          "Mozilla/5.0 DailyNews"
                      }
                  )


                  with urllib.request.urlopen(
                      request,
                      timeout=20
                  ) as response:

                      data = response.read()


                  root = ET.fromstring(
                      data
                  )


                  items = root.findall(
                      ".//item"
                  )


                  if not items:

                      items = root.findall(
                          ".//{*}item"
                      )


                  for item in items[:30]:

                      title = item.findtext(
                          "title",
                          ""
                      )

                      link = item.findtext(
                          "link",
                          ""
                      )

                      description = item.findtext(
                          "description",
                          ""
                      )

                      pub_date = item.findtext(
                          "pubDate",
                          ""
                      )


                      title = clean_text(
                          title
                      )

                      description = clean_text(
                          description
                      )

                      link = link.strip()


                      if not title or not link:
                          continue


                      # --------------------------------
                      # CLASSIFY TOPIC
                      # --------------------------------

                      topic = classify_topic(
                          title,
                          description,
                          source.get(
                              "topics",
                              []
                          )
                      )


                      # --------------------------------
                      # CLASSIFY REGION
                      # --------------------------------

                      region = classify_region(
                          title,
                          description,
                          source
                      )


                      article = {

                          "id": hashlib.sha1(
                              link.encode(
                                  "utf-8"
                              )
                          ).hexdigest()[:12],

                          "title": title,

                          "summary": make_summary(
                              description
                          ),

                          "link": link,

                          "sourceName":
                              source["name"],

                          "region":
                              region,

                          "topic":
                              topic,

                          "time":
                              pub_date
                      }


                      articles.append(
                          article
                      )


              except Exception as error:

                  print(
                      "ERROR:",
                      source["name"]
                  )

                  print(error)


          # --------------------------------------------------
          # REMOVE DUPLICATES BY LINK
          # --------------------------------------------------

          unique = {}


          for article in articles:

              if article["link"] not in unique:

                  unique[
                      article["link"]
                  ] = article


          articles = list(
              unique.values()
          )


          # --------------------------------------------------
          # GROUP SIMILAR NEWS
          # --------------------------------------------------

          groups = []


          for article in articles:

              found_group = None


              for group in groups:

                  representative = group[0]


                  if similar_titles(
                      article["title"],
                      representative["title"]
                  ):

                      found_group = group
                      break


              if found_group:

                  found_group.append(
                      article
                  )

              else:

                  groups.append(
                      [article]
                  )


          # --------------------------------------------------
          # CREATE FINAL NEWS
          # --------------------------------------------------

          final_articles = []


          region_priority = {

              "local": 0,
              "regional": 1,
              "germany": 2,
              "turkey": 3,
              "international": 4
          }


          for group in groups:

              # ------------------------------------------------
              # IMPORTANT:
              # Only group articles that belong to the same
              # region AND same topic.
              # ------------------------------------------------

              subgroups = {}


              for article in group:

                  key = (
                      article["region"],
                      article["topic"]
                  )


                  if key not in subgroups:

                      subgroups[key] = []


                  subgroups[key].append(
                      article
                  )


              for subgroup in subgroups.values():

                  subgroup.sort(
                      key=lambda x:
                      region_priority.get(
                          x["region"],
                          9
                      )
                  )


                  main = subgroup[0]


                  coverage = []


                  for article in subgroup:

                      coverage.append({

                          "sourceName":
                              article[
                                  "sourceName"
                              ],

                          "link":
                              article[
                                  "link"
                              ],

                          "summary":
                              article[
                                  "summary"
                              ]

                      })


                  main["coverage"] = coverage

                  main["sourcesCount"] = len(
                      coverage
                  )


                  final_articles.append(
                      main
                  )


          # --------------------------------------------------
          # SORT
          # --------------------------------------------------

          final_articles.sort(
              key=lambda x: (
                  region_priority.get(
                      x["region"],
                      9
                  ),
                  x.get(
                      "time",
                      ""
                  )
              ),
              reverse=False
          )


          # Newest articles should appear first
          # within the complete result.

          final_articles.sort(
              key=lambda x:
              x.get(
                  "time",
                  ""
              ),
              reverse=True
          )


          # --------------------------------------------------
          # LIMIT
          # --------------------------------------------------

          final_articles = final_articles[:300]


          # --------------------------------------------------
          # OUTPUT
          # --------------------------------------------------

          result = {

              "updated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "articles":
                  final_articles

          }


          with open(
              "news.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          # --------------------------------------------------
          # DEBUG INFORMATION
          # --------------------------------------------------

          region_counts = {}

          topic_counts = {}


          for article in final_articles:

              region = article["region"]
              topic = article["topic"]


              region_counts[region] = \
                  region_counts.get(
                      region,
                      0
                  ) + 1


              topic_counts[topic] = \
                  topic_counts.get(
                      topic,
                      0
                  ) + 1


          print(
              "FINAL ARTICLES:",
              len(final_articles)
          )

          print(
              "REGIONS:",
              region_counts
          )

          print(
              "TOPICS:",
              topic_counts
          )


          PY


      - name: Commit news

        run: |

          git config user.name \
            "github-actions"

          git config user.email \
            "github-actions@github.com"

          git add news.json

          git diff --cached --quiet || \
            git commit \
            -m "Update news"

          git push
