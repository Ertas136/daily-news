<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Daily News">

  <title>Daily News</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      background: #f5f5f7;
      color: #111;
    }

    /* ---------------------------------
       HEADER
    --------------------------------- */

    header {
      position: sticky;
      top: 0;
      z-index: 100;

      background: rgba(255,255,255,.96);
      backdrop-filter: blur(12px);

      border-bottom: 1px solid #ddd;

      padding:
        14px
        14px
        10px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 24px;
      line-height: 1.2;
    }

    #updated {
      font-size: 12px;
      color: #777;
      margin-bottom: 12px;
    }

    .filter-title {
      font-size: 11px;
      font-weight: 800;
      color: #777;

      margin:
        9px
        0
        6px;

      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .filters {
      display: flex;
      gap: 7px;

      overflow-x: auto;

      padding-bottom: 4px;

      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    button {
      border: 1px solid #ccc;

      background: white;

      border-radius: 18px;

      padding:
        8px
        13px;

      white-space: nowrap;

      font-size: 13px;

      cursor: pointer;

      transition:
        background .15s,
        color .15s;
    }

    button.active {
      background: #111;
      color: white;
      border-color: #111;
    }


    /* ---------------------------------
       MAIN
    --------------------------------- */

    main {
      max-width: 900px;
      margin: auto;

      padding:
        14px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 800;

      margin:
        8px
        0
        12px;
    }


    /* ---------------------------------
       ARTICLE
    --------------------------------- */

    .article {
      background: white;

      border-radius: 14px;

      padding: 15px;

      margin-bottom: 12px;

      box-shadow:
        0 1px 4px rgba(0,0,0,.08);
    }

    .article h3 {
      margin:
        0
        0
        7px;

      font-size: 17px;

      line-height: 1.3;
    }

    .summary {
      font-size: 14px;

      line-height: 1.45;

      color: #444;

      margin-bottom: 9px;
    }

    .meta {
      font-size: 12px;

      color: #777;

      margin-bottom: 9px;
    }

    .tags {
      display: flex;

      gap: 5px;

      flex-wrap: wrap;

      margin-bottom: 9px;
    }

    .tag {
      background: #eee;

      border-radius: 10px;

      padding:
        3px
        7px;

      font-size: 11px;
    }

    .article a {
      color: #0066cc;

      text-decoration: none;

      font-size: 13px;

      font-weight: 600;
    }


    /* ---------------------------------
       COVERAGE
    --------------------------------- */

    .coverage {
      margin-top: 12px;

      padding-top: 10px;

      border-top: 1px solid #eee;
    }

    .coverage-title {
      font-size: 12px;

      font-weight: 700;

      color: #666;

      margin-bottom: 6px;
    }

    .coverage a {
      display: block;

      margin:
        5px
        0;

      font-size: 12px;
    }


    /* ---------------------------------
       STATUS
    --------------------------------- */

    #loading,
    #error,
    #empty {
      text-align: center;

      padding:
        35px
        15px;

      color: #777;
    }

    #error {
      color: #b00020;
    }


    /* ---------------------------------
       DESKTOP
    --------------------------------- */

    @media (min-width: 700px) {

      main {
        padding-top: 25px;
      }

      .article {
        padding: 18px;
      }

    }

  </style>
</head>


<body>


<header>

  <h1>📰 Daily News</h1>

  <div id="updated">
    Lade Nachrichten …
  </div>


  <!-- ================================
       REGION
  ================================= -->

  <div class="filter-title">
    Region
  </div>

  <div
    class="filters"
    id="regionFilters"
  >

    <button
      class="active"
      data-region="all"
    >
      Alle
    </button>

    <button
      data-region="local"
    >
      📍 Ravensburg
    </button>

    <button
      data-region="regional"
    >
      🏞️ Region
    </button>

    <button
      data-region="germany"
    >
      🇩🇪 Deutschland
    </button>

    <button
      data-region="turkey"
    >
      🇹🇷 Türkei
    </button>

    <button
      data-region="international"
    >
      🌍 International
    </button>

  </div>


  <!-- ================================
       THEMA
  ================================= -->

  <div class="filter-title">
    Thema
  </div>

  <div
    class="filters"
    id="topicFilters"
  >

    <button
      class="active"
      data-topic="all"
    >
      Alle
    </button>

    <button
      data-topic="politik"
    >
      🏛️ Politik
    </button>

    <button
      data-topic="wirtschaft"
    >
      💶 Wirtschaft
    </button>

    <button
      data-topic="sport"
    >
      ⚽ Sport
    </button>

    <button
      data-topic="technologie"
    >
      💻 Technologie
    </button>

    <button
      data-topic="gesellschaft"
    >
      🌍 Gesellschaft
    </button>

    <button
      data-topic="wissenschaft"
    >
      🔬 Wissenschaft
    </button>

  </div>

</header>


<main>

  <div id="loading">
    Nachrichten werden geladen …
  </div>

  <div
    id="error"
    style="display:none;"
  ></div>

  <div
    id="empty"
    style="display:none;"
  >
    Keine Nachrichten für diese Auswahl gefunden.
  </div>

  <div id="content"></div>

</main>


<script>

  /* ==================================
     STATE
  ================================== */

  let allArticles = [];

  let selectedRegion = "all";

  let selectedTopic = "all";


  /* ==================================
     FILTER
     
     WICHTIG:
     Region UND Thema
     
     Keine zusätzliche automatische
     Erkennung im Frontend.
  ================================== */

  function getFilteredArticles() {

    return allArticles.filter(article => {

      const regionMatches =
        selectedRegion === "all" ||
        article.region === selectedRegion;


      const topicMatches =
        selectedTopic === "all" ||
        article.topic === selectedTopic;


      return (
        regionMatches &&
        topicMatches
      );

    });

  }


  /* ==================================
     RENDER
  ================================== */

  function render() {

    const content =
      document.getElementById("content");

    const empty =
      document.getElementById("empty");


    content.innerHTML = "";


    const filtered =
      getFilteredArticles();


    if (!filtered.length) {

      empty.style.display = "block";

      return;

    }


    empty.style.display = "none";


    /* --------------------------------
       TOP NEWS
       
       Nur bei Alle + Alle
    -------------------------------- */

    if (
      selectedRegion === "all" &&
      selectedTopic === "all"
    ) {

      const topSection =
        document.createElement("section");


      topSection.innerHTML = `
        <div class="section-title">
          ⭐ Top News
        </div>
      `;


      filtered
        .slice(0, 10)
        .forEach(article => {

          topSection.appendChild(
            createArticle(article)
          );

        });


      content.appendChild(
        topSection
      );


      /* --------------------------------
         ALLE NACHRICHTEN
      -------------------------------- */

      if (filtered.length > 10) {

        const allSection =
          document.createElement("section");


        allSection.innerHTML = `
          <div class="section-title">
            Alle Nachrichten
          </div>
        `;


        filtered
          .slice(10)
          .forEach(article => {

            allSection.appendChild(
              createArticle(article)
            );

          });


        content.appendChild(
          allSection
        );

      }

    }


    /* --------------------------------
       FILTERERGEBNIS
    -------------------------------- */

    else {

      const title =
        document.createElement("div");


      title.className =
        "section-title";


      title.textContent =
        `${filtered.length} Nachrichten`;


      content.appendChild(
        title
      );


      filtered.forEach(article => {

        content.appendChild(
          createArticle(article)
        );

      });

    }

  }


  /* ==================================
     ARTICLE
  ================================== */

  function createArticle(article) {

    const div =
      document.createElement("article");


    div.className =
      "article";


    const title =
      article.title ||
      "Ohne Titel";


    const summary =
      article.summary ||
      "";


    const source =
      article.sourceName ||
      "Unbekannte Quelle";


    /* --------------------------------
       TIME
    -------------------------------- */

    let dateText = "";


    if (article.time) {

      const date =
        new Date(article.time);


      if (!isNaN(date)) {

        dateText =
          date.toLocaleString(
            "de-DE",
            {
              dateStyle: "short",
              timeStyle: "short"
            }
          );

      }

    }


    /* --------------------------------
       TAGS
    -------------------------------- */

    let tags = "";


    if (article.region) {

      tags += `
        <span class="tag">
          ${escapeHtml(
            regionName(article.region)
          )}
        </span>
      `;

    }


    if (article.topic) {

      tags += `
        <span class="tag">
          ${escapeHtml(
            topicName(article.topic)
          )}
        </span>
      `;

    }


    /* --------------------------------
       WEITERE BERICHTERSTATTUNG
    -------------------------------- */

    let coverageHTML = "";


    if (
      Array.isArray(article.coverage) &&
      article.coverage.length > 1
    ) {

      coverageHTML = `

        <div class="coverage">

          <div class="coverage-title">
            Weitere Berichterstattung
          </div>

          ${article.coverage
            .slice(1, 4)
            .map(item => {

              return `

                <a
                  href="${escapeAttribute(
                    item.link || "#"
                  )}"
                  target="_blank"
                  rel="noopener"
                >
                  ${escapeHtml(
                    item.sourceName ||
                    "Weitere Quelle"
                  )}
                  –
                  ${escapeHtml(
                    item.summary || ""
                  )}
                </a>

              `;

            })
            .join("")
          }

        </div>

      `;

    }


    /* --------------------------------
       HTML
    -------------------------------- */

    div.innerHTML = `

      <h3>
        ${escapeHtml(title)}
      </h3>


      ${
        summary
          ? `
            <div class="summary">
              ${escapeHtml(summary)}
            </div>
          `
          : ""
      }


      <div class="meta">

        ${escapeHtml(source)}

        ${
          dateText
            ? ` · ${escapeHtml(dateText)}`
            : ""
        }

      </div>


      ${
        tags
          ? `
            <div class="tags">
              ${tags}
            </div>
          `
          : ""
      }


      ${
        article.link
          ? `
            <a
              href="${escapeAttribute(
                article.link
              )}"
              target="_blank"
              rel="noopener"
            >
              Originalartikel →
            </a>
          `
          : ""
      }


      ${coverageHTML}

    `;


    return div;

  }


  /* ==================================
     REGION NAMEN
  ================================== */

  function regionName(region) {

    const names = {

      local:
        "Ravensburg",

      regional:
        "Region",

      germany:
        "Deutschland",

      turkey:
        "Türkei",

      international:
        "International"

    };


    return (
      names[region] ||
      region
    );

  }


  /* ==================================
     THEMA NAMEN
  ================================== */

  function topicName(topic) {

    const names = {

      politik:
        "Politik",

      wirtschaft:
        "Wirtschaft",

      sport:
        "Sport",

      technologie:
        "Technologie",

      gesellschaft:
        "Gesellschaft",

      wissenschaft:
        "Wissenschaft"

    };


    return (
      names[topic] ||
      topic
    );

  }


  /* ==================================
     HTML ESCAPING
  ================================== */

  function escapeHtml(value) {

    return String(value)

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }


  function escapeAttribute(value) {

    return escapeHtml(value);

  }


  /* ==================================
     REGION BUTTONS
  ================================== */

  document
    .querySelectorAll(
      "#regionFilters button"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              "#regionFilters button"
            )
            .forEach(b => {

              b.classList.remove(
                "active"
              );

            });


          button.classList.add(
            "active"
          );


          selectedRegion =
            button.dataset.region;


          render();

        }
      );

    });


  /* ==================================
     TOPIC BUTTONS
  ================================== */

  document
    .querySelectorAll(
      "#topicFilters button"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              "#topicFilters button"
            )
            .forEach(b => {

              b.classList.remove(
                "active"
              );

            });


          button.classList.add(
            "active"
          );


          selectedTopic =
            button.dataset.topic;


          render();

        }
      );

    });


  /* ==================================
     LOAD NEWS
  ================================== */

  async function loadNews() {

    const loading =
      document.getElementById(
        "loading"
      );


    const error =
      document.getElementById(
        "error"
      );


    try {

      loading.style.display =
        "block";

      error.style.display =
        "none";


      const response =
        await fetch(
          "news.json?cache=" +
          Date.now()
        );


      if (!response.ok) {

        throw new Error(
          "news.json konnte nicht geladen werden."
        );

      }


      const data =
        await response.json();


      allArticles =
        Array.isArray(
          data.articles
        )
          ? data.articles
          : [];


      /* --------------------------------
         SORTIERUNG
         
         Neueste zuerst
      -------------------------------- */

      allArticles.sort(
        (a, b) => {

          const dateA =
            new Date(
              a.time || 0
            ).getTime();


          const dateB =
            new Date(
              b.time || 0
            ).getTime();


          return dateB - dateA;

        }
      );


      /* --------------------------------
         UPDATED
      -------------------------------- */

      if (data.updated) {

        const updated =
          new Date(
            data.updated
          );


        document
          .getElementById(
            "updated"
          )
          .textContent =
          "Zuletzt aktualisiert: " +
          updated.toLocaleString(
            "de-DE",
            {
              dateStyle: "short",
              timeStyle: "short"
            }
          );

      }


      loading.style.display =
        "none";


      render();

    }


    catch (err) {

      loading.style.display =
        "none";


      error.style.display =
        "block";


      error.textContent =
        "Fehler beim Laden der Nachrichten: " +
        err.message;


      console.error(err);

    }

  }


  /* ==================================
     START
  ================================== */

  loadNews();


  /* ==================================
     AUTOMATISCHES UPDATE
     
     Alle 30 Minuten
  ================================== */

  setInterval(
    loadNews,
    30 * 60 * 1000
  );

</script>

</body>
</html>
