<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Daily News">

  <title>Daily News</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f5f5f7;
      color: #111;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #ddd;
      padding: 14px 14px 10px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 24px;
    }

    #updated {
      font-size: 12px;
      color: #777;
      margin-bottom: 12px;
    }

    .filter-title {
      font-size: 12px;
      font-weight: 700;
      color: #666;
      margin: 8px 0 6px;
      text-transform: uppercase;
    }

    .filters {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    button {
      border: 1px solid #ccc;
      background: white;
      border-radius: 18px;
      padding: 8px 13px;
      white-space: nowrap;
      font-size: 13px;
      cursor: pointer;
    }

    button.active {
      background: #111;
      color: white;
      border-color: #111;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 14px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 800;
      margin: 8px 0 12px;
    }

    .article {
      background: white;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }

    .article h3 {
      margin: 0 0 7px;
      font-size: 17px;
      line-height: 1.25;
    }

    .summary {
      font-size: 14px;
      line-height: 1.45;
      color: #444;
      margin-bottom: 9px;
    }

    .meta {
      font-size: 12px;
      color: #777;
      margin-bottom: 9px;
    }

    .tags {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-bottom: 9px;
    }

    .tag {
      background: #eee;
      border-radius: 10px;
      padding: 3px 7px;
      font-size: 11px;
    }

    .article a {
      color: #0066cc;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }

    .coverage {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #eee;
    }

    .coverage-title {
      font-size: 12px;
      font-weight: 700;
      color: #666;
      margin-bottom: 6px;
    }

    .coverage a {
      display: block;
      margin: 5px 0;
      font-size: 12px;
    }

    #loading,
    #error,
    #empty {
      text-align: center;
      padding: 35px 15px;
      color: #777;
    }

    @media (min-width: 700px) {
      main {
        padding-top: 25px;
      }

      .article {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

<header>

  <h1>📰 Daily News</h1>

  <div id="updated">
    Lade Nachrichten …
  </div>

  <div class="filter-title">Region</div>

  <div class="filters" id="regionFilters">
    <button class="active" data-region="all">Alle</button>
    <button data-region="ravensburg">📍 Ravensburg</button>
    <button data-region="region">🏞️ Region</button>
    <button data-region="deutschland">🇩🇪 Deutschland</button>
    <button data-region="tuerkei">🇹🇷 Türkei</button>
    <button data-region="international">🌍 International</button>
  </div>

  <div class="filter-title">Thema</div>

  <div class="filters" id="topicFilters">
    <button class="active" data-topic="all">Alle</button>
    <button data-topic="politik">🏛️ Politik</button>
    <button data-topic="wirtschaft">💶 Wirtschaft</button>
    <button data-topic="sport">⚽ Sport</button>
    <button data-topic="technologie">💻 Technologie</button>
    <button data-topic="gesellschaft">🌍 Gesellschaft</button>
    <button data-topic="wissenschaft">🔬 Wissenschaft</button>
  </div>

</header>

<main>

  <div id="loading">
    Nachrichten werden geladen …
  </div>

  <div id="error" style="display:none;"></div>

  <div id="empty" style="display:none;">
    Keine Nachrichten für diese Auswahl gefunden.
  </div>

  <div id="content"></div>

</main>

<script>

let allArticles = [];

let selectedRegion = "all";
let selectedTopic = "all";


/* -----------------------------------
   NORMALISIERUNG
----------------------------------- */

function normalize(value) {

  if (!value) return "";

  return String(value)
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/ä/g, "a")
    .replace(/ö/g, "o")
    .replace(/ü/g, "u")
    .replace(/ß/g, "ss")
    .trim();

}


/* -----------------------------------
   REGION ERKENNEN
----------------------------------- */

function articleMatchesRegion(article, region) {

  if (region === "all") {
    return true;
  }

  const value = normalize(article.region);

  const source = normalize(article.source);

  const title = normalize(article.title);

  const url = normalize(article.url);


  if (region === "ravensburg") {

    return (
      value.includes("ravensburg") ||
      source.includes("schwabische") ||
      title.includes("ravensburg") ||
      title.includes("weingarten") ||
      title.includes("baienfurt") ||
      title.includes("wolpertswende") ||
      title.includes("bad waldsee") ||
      url.includes("ravensburg")
    );

  }


  if (region === "region") {

    return (
      value.includes("region") ||
      value.includes("baden") ||
      value.includes("oberschwaben") ||
      value.includes("bodensee") ||
      value.includes("ravensburg") ||
      source.includes("dasding") ||
      source.includes("schwabische")
    );

  }


  if (region === "deutschland") {

    return (
      value.includes("deutschland") ||
      value === "germany" ||
      value.includes("national")
    );

  }


  if (region === "tuerkei") {

    return (
      value.includes("turkei") ||
      value.includes("türkei") ||
      value.includes("turkey") ||
      source.includes("trt") ||
      source.includes("ensonhaber")
    );

  }


  if (region === "international") {

    return (
      value.includes("international") ||
      value.includes("ausland") ||
      value.includes("welt") ||
      value === "world"
    );

  }


  return false;

}


/* -----------------------------------
   THEMA ERKENNEN
----------------------------------- */

function articleMatchesTopic(article, topic) {

  if (topic === "all") {
    return true;
  }

  const articleTopic = normalize(article.topic);

  const topics = Array.isArray(article.topics)
    ? article.topics.map(normalize)
    : [];

  const title = normalize(article.title);
  const summary = normalize(article.summary);


  if (
    articleTopic === topic ||
    topics.includes(topic)
  ) {
    return true;
  }


  /*
    Falls topic im RSS-Import nicht sauber gesetzt wurde,
    prüfen wir zusätzlich den Inhalt.
  */

  const keywords = {

    politik: [
      "politik",
      "regierung",
      "bundestag",
      "kanzler",
      "minister",
      "wahl",
      "parlament",
      "parteien",
      "koalition",
      "präsident",
      "präsidentin",
      "politiker"
    ],

    wirtschaft: [
      "wirtschaft",
      "unternehmen",
      "aktien",
      "börse",
      "inflation",
      "konjunktur",
      "arbeitsmarkt",
      "unternehmen",
      "industrie",
      "euro",
      "dax",
      "finanzen"
    ],

    sport: [
      "sport",
      "fußball",
      "fussball",
      "bundesliga",
      "champions league",
      "tennis",
      "basketball",
      "formel 1",
      "olympia"
    ],

    technologie: [
      "technologie",
      "technik",
      "ki",
      "künstliche intelligenz",
      "software",
      "apple",
      "google",
      "microsoft",
      "iphone",
      "computer",
      "digital",
      "cyber"
    ],

    gesellschaft: [
      "gesellschaft",
      "menschen",
      "familie",
      "bildung",
      "schule",
      "kultur",
      "sozial",
      "gesundheit"
    ],

    wissenschaft: [
      "wissenschaft",
      "forschung",
      "studie",
      "forscher",
      "medizin",
      "klima",
      "weltraum",
      "nasa"
    ]

  };


  const searchText = title + " " + summary;

  return (keywords[topic] || []).some(keyword =>
    searchText.includes(normalize(keyword))
  );

}


/* -----------------------------------
   FILTER
----------------------------------- */

function getFilteredArticles() {

  return allArticles.filter(article => {

    const regionOK =
      articleMatchesRegion(article, selectedRegion);

    const topicOK =
      articleMatchesTopic(article, selectedTopic);

    return regionOK && topicOK;

  });

}


/* -----------------------------------
   RENDER
----------------------------------- */

function render() {

  const content = document.getElementById("content");
  const empty = document.getElementById("empty");

  content.innerHTML = "";

  const filtered = getFilteredArticles();


  if (!filtered.length) {

    empty.style.display = "block";

    return;

  }


  empty.style.display = "none";


  /*
    Top News nur bei "Alle + Alle"
  */

  if (
    selectedRegion === "all" &&
    selectedTopic === "all"
  ) {

    const top = document.createElement("div");

    top.innerHTML = `
      <div class="section-title">⭐ Top News</div>
    `;

    filtered.slice(0, 10).forEach(article => {
      top.appendChild(createArticle(article));
    });

    content.appendChild(top);


    const rest = document.createElement("div");

    rest.innerHTML = `
      <div class="section-title">Alle Nachrichten</div>
    `;

    filtered.slice(10).forEach(article => {
      rest.appendChild(createArticle(article));
    });

    content.appendChild(rest);

  } else {

    const title = document.createElement("div");

    title.className = "section-title";

    title.textContent =
      `${filtered.length} Nachrichten`;

    content.appendChild(title);


    filtered.forEach(article => {
      content.appendChild(createArticle(article));
    });

  }

}


/* -----------------------------------
   ARTIKEL
----------------------------------- */

function createArticle(article) {

  const div = document.createElement("article");

  div.className = "article";


  const title =
    article.title || "Ohne Titel";


  const summary =
    article.summary ||
    article.description ||
    "";


  const source =
    article.source ||
    "Unbekannte Quelle";


  let dateText = "";

  if (article.published) {

    const date = new Date(article.published);

    if (!isNaN(date)) {

      dateText = date.toLocaleString(
        "de-DE",
        {
          dateStyle: "short",
          timeStyle: "short"
        }
      );

    }

  }


  let tags = "";


  if (article.region) {

    tags += `
      <span class="tag">
        ${escapeHtml(article.region)}
      </span>
    `;

  }


  if (article.topic) {

    tags += `
      <span class="tag">
        ${escapeHtml(article.topic)}
      </span>
    `;

  }


  let coverageHTML = "";


  if (
    Array.isArray(article.coverage) &&
    article.coverage.length > 1
  ) {

    coverageHTML = `
      <div class="coverage">

        <div class="coverage-title">
          Weitere Berichterstattung
        </div>

        ${article.coverage
          .slice(1, 4)
          .map(item => `
            <a
              href="${escapeAttribute(item.url || "#")}"
              target="_blank"
              rel="noopener"
            >
              ${escapeHtml(item.source || "Weitere Quelle")}
              – ${escapeHtml(item.title || "")}
            </a>
          `)
          .join("")
        }

      </div>
    `;

  }


  div.innerHTML = `

    <h3>
      ${escapeHtml(title)}
    </h3>

    ${
      summary
      ? `<div class="summary">
           ${escapeHtml(summary)}
         </div>`
      : ""
    }

    <div class="meta">
      ${escapeHtml(source)}
      ${dateText ? " · " + dateText : ""}
    </div>

    ${
      tags
      ? `<div class="tags">${tags}</div>`
      : ""
    }

    ${
      article.url
      ? `
        <a
          href="${escapeAttribute(article.url)}"
          target="_blank"
          rel="noopener"
        >
          Originalartikel →
        </a>
      `
      : ""
    }

    ${coverageHTML}

  `;


  return div;

}


/* -----------------------------------
   SICHERHEIT
----------------------------------- */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeAttribute(value) {

  return escapeHtml(value);

}


/* -----------------------------------
   FILTER BUTTONS
----------------------------------- */

document
  .querySelectorAll("#regionFilters button")
  .forEach(button => {

    button.addEventListener("click", () => {

      document
        .querySelectorAll("#regionFilters button")
        .forEach(b =>
          b.classList.remove("active")
        );

      button.classList.add("active");

      selectedRegion =
        button.dataset.region;

      render();

    });

  });


document
  .querySelectorAll("#topicFilters button")
  .forEach(button => {

    button.addEventListener("click", () => {

      document
        .querySelectorAll("#topicFilters button")
        .forEach(b =>
          b.classList.remove("active")
        );

      button.classList.add("active");

      selectedTopic =
        button.dataset.topic;

      render();

    });

  });


/* -----------------------------------
   NEWS LADEN
----------------------------------- */

async function loadNews() {

  const loading =
    document.getElementById("loading");

  const error =
    document.getElementById("error");

  try {

    loading.style.display = "block";
    error.style.display = "none";


    const response = await fetch(
      "news.json?cache=" + Date.now()
    );


    if (!response.ok) {

      throw new Error(
        "news.json konnte nicht geladen werden."
      );

    }


    const data = await response.json();


    allArticles =
      Array.isArray(data.articles)
        ? data.articles
        : [];


    /*
      Neueste zuerst
    */

    allArticles.sort((a, b) => {

      const dateA =
        new Date(a.published || 0).getTime();

      const dateB =
        new Date(b.published || 0).getTime();

      return dateB - dateA;

    });


    if (data.updated) {

      const updated =
        new Date(data.updated);

      document.getElementById("updated").textContent =
        "Zuletzt aktualisiert: " +
        updated.toLocaleString(
          "de-DE",
          {
            dateStyle: "short",
            timeStyle: "short"
          }
        );

    }


    loading.style.display = "none";

    render();

  }

  catch (err) {

    loading.style.display = "none";

    error.style.display = "block";

    error.innerHTML = `
      Fehler beim Laden der Nachrichten:<br>
      ${escapeHtml(err.message)}
    `;

    console.error(err);

  }

}


/* -----------------------------------
   START
----------------------------------- */

loadNews();


/*
  Alle 30 Minuten aktualisieren
*/

setInterval(
  loadNews,
  30 * 60 * 1000
);

</script>

</body>
</html>
