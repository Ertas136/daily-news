<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1"
>

<title>Daily News</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background: #f4f5f7;

  color: #111827;
}


header {

  position: sticky;

  top: 0;

  z-index: 20;

  background:
    rgba(255,255,255,.96);

  backdrop-filter:
    blur(14px);

  border-bottom:
    1px solid #ddd;

  padding: 14px 16px;
}


h1 {

  margin: 0 0 12px;

  font-size: 27px;

}


.filters {

  display: flex;

  gap: 7px;

  overflow-x: auto;

  padding-bottom: 4px;

}


button {

  border: 0;

  background: #e5e7eb;

  border-radius: 999px;

  padding: 8px 13px;

  font-size: 13px;

  white-space: nowrap;

}


button.active {

  background: #111827;

  color: white;

}


main {

  max-width: 1000px;

  margin: auto;

  padding: 18px;

}


.section-title {

  font-size: 21px;

  font-weight: 700;

  margin:
    8px 0 13px;

}


.news-grid {

  display: grid;

  gap: 14px;

}


.article {

  background: white;

  border-radius: 17px;

  padding: 17px;

  box-shadow:
    0 2px 9px rgba(0,0,0,.06);

}


.article h2 {

  margin:
    0 0 9px;

  font-size: 19px;

  line-height: 1.3;

}


.summary {

  font-size: 15px;

  line-height: 1.45;

  color: #374151;

  margin-bottom: 10px;

}


.meta {

  font-size: 12px;

  color: #6b7280;

  margin-bottom: 10px;

}


.tags {

  display: flex;

  gap: 6px;

  flex-wrap: wrap;

  margin-bottom: 12px;

}


.tag {

  background: #eef2ff;

  color: #374151;

  padding:
    4px 8px;

  border-radius: 999px;

  font-size: 11px;

}


.main-source {

  font-size: 12px;

  font-weight: 600;

  margin-bottom: 10px;

}


.coverage {

  margin-top: 15px;

  padding-top: 13px;

  border-top:
    1px solid #e5e7eb;

}


.coverage-title {

  font-weight: 700;

  font-size: 14px;

  margin-bottom: 8px;

}


.coverage-item {

  background: #f7f7f8;

  border-radius: 11px;

  padding: 10px;

  margin-bottom: 8px;

}


.coverage-source {

  font-size: 12px;

  font-weight: 700;

  margin-bottom: 4px;

}


.coverage-summary {

  font-size: 13px;

  line-height: 1.4;

  color: #4b5563;

  margin-bottom: 6px;

}


.coverage-item a {

  font-size: 12px;

  text-decoration: none;

}


.original {

  display: inline-block;

  background: #111827;

  color: white;

  text-decoration: none;

  border-radius: 9px;

  padding: 8px 11px;

  font-size: 12px;

}


.status {

  text-align: center;

  color: #6b7280;

  padding: 30px 10px;

}


.updated {

  font-size: 11px;

  color: #6b7280;

  margin-top: 4px;

}


@media (min-width: 700px) {

  .news-grid {

    grid-template-columns:
      repeat(2, 1fr);

  }

}

</style>

</head>


<body>


<header>

<h1>📰 Daily News</h1>

<div
  id="updated"
  class="updated"
>
  Nachrichten werden geladen …
</div>


<br>


<div
  class="filters"
  id="regionFilters"
>

<button
  class="active"
  data-region="all"
>
  Alle
</button>

<button data-region="local">
  📍 Ravensburg
</button>

<button data-region="regional">
  🏞️ Region
</button>

<button data-region="germany">
  🇩🇪 Deutschland
</button>

<button data-region="turkey">
  🇹🇷 Türkei
</button>

<button data-region="international">
  🌍 International
</button>

</div>


<br>


<div
  class="filters"
  id="topicFilters"
>

<button
  class="active"
  data-topic="all"
>
  Alle Themen
</button>

<button data-topic="politik">
  🏛️ Politik
</button>

<button data-topic="wirtschaft">
  💶 Wirtschaft
</button>

<button data-topic="sport">
  ⚽ Sport
</button>

<button data-topic="technologie">
  💻 Technologie
</button>

<button data-topic="gesellschaft">
  🌍 Gesellschaft
</button>

<button data-topic="wissenschaft">
  🔬 Wissenschaft
</button>

</div>

</header>


<main>


<div class="section-title">
  ⭐ Top News
</div>


<div
  id="topNews"
  class="news-grid"
>

<div class="status">
  Nachrichten werden geladen …
</div>

</div>


<div
  class="section-title"
  style="margin-top:32px"
>

Alle Nachrichten

</div>


<div
  id="news"
  class="news-grid"
>

<div class="status">
  Nachrichten werden geladen …
</div>

</div>


</main>


<script>


let allArticles = [];

let selectedRegion = "all";

let selectedTopic = "all";


function escapeHtml(text) {

  return String(text || "")

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");

}


function cleanSummary(text) {

  const div =
    document.createElement("div");

  div.innerHTML =
    text || "";

  return (
    div.textContent ||
    div.innerText ||
    ""
  );

}


function formatTime(value) {

  if (!value)
    return "";

  const date =
    new Date(value);

  if (isNaN(date))
    return value;

  return new Intl.DateTimeFormat(
    "de-DE",
    {
      dateStyle: "short",
      timeStyle: "short"
    }
  ).format(date);

}


function regionName(region) {

  const names = {

    local:
      "📍 Ravensburg",

    regional:
      "🏞️ Region",

    germany:
      "🇩🇪 Deutschland",

    turkey:
      "🇹🇷 Türkei",

    international:
      "🌍 International"

  };

  return names[region] || "";

}


function topicName(topic) {

  const names = {

    politik:
      "🏛️ Politik",

    wirtschaft:
      "💶 Wirtschaft",

    sport:
      "⚽ Sport",

    technologie:
      "💻 Technologie",

    gesellschaft:
      "🌍 Gesellschaft",

    wissenschaft:
      "🔬 Wissenschaft"

  };

  return names[topic] || "";

}


function createCoverage(article) {

  if (
    !article.coverage ||
    article.coverage.length < 2
  ) {

    return "";

  }


  const items =
    article.coverage
      .slice(1, 4)
      .map(item => {

        return `

          <div class="coverage-item">

            <div class="coverage-source">

              ${escapeHtml(
                item.sourceName
              )}

            </div>

            <div class="coverage-summary">

              ${escapeHtml(
                cleanSummary(
                  item.summary
                )
              )}

            </div>

            <a
              href="${escapeHtml(
                item.link
              )}"
              target="_blank"
              rel="noopener noreferrer"
            >

              Originalartikel →

            </a>

          </div>

        `;

      })
      .join("");


  if (!items)
    return "";


  return `

    <div class="coverage">

      <div class="coverage-title">

        📰 Weitere Berichterstattung

      </div>

      ${items}

    </div>

  `;

}


function createArticle(article) {

  const div =
    document.createElement("article");

  div.className =
    "article";


  const summary =
    cleanSummary(
      article.summary
    );


  div.innerHTML = `

    <h2>

      ${escapeHtml(
        article.title
      )}

    </h2>


    <div class="summary">

      ${escapeHtml(
        summary
      )}

    </div>


    <div class="tags">

      <span class="tag">

        ${escapeHtml(
          regionName(
            article.region
          )
        )}

      </span>


      <span class="tag">

        ${escapeHtml(
          topicName(
            article.topic
          )
        )}

      </span>

    </div>


    <div class="main-source">

      ${escapeHtml(
        article.sourceName
      )}

      ${
        article.time
          ? " · " +
            escapeHtml(
              formatTime(
                article.time
              )
            )
          : ""
      }

    </div>


    <a
      class="original"
      href="${escapeHtml(
        article.link
      )}"
      target="_blank"
      rel="noopener noreferrer"
    >

      Originalartikel →

    </a>


    ${createCoverage(article)}

  `;


  return div;

}


function getFiltered() {

  return allArticles.filter(
    article => {

      const regionOK =
        selectedRegion === "all" ||
        article.region ===
          selectedRegion;


      const topicOK =
        selectedTopic === "all" ||
        article.topic ===
          selectedTopic;


      return (
        regionOK &&
        topicOK
      );

    }
  );

}


function render() {

  const articles =
    getFiltered();


  const top =
    document.getElementById(
      "topNews"
    );


  const news =
    document.getElementById(
      "news"
    );


  top.innerHTML = "";

  news.innerHTML = "";


  if (!articles.length) {

    top.innerHTML =
      `<div class="status">
        Keine Nachrichten gefunden.
      </div>`;

    news.innerHTML =
      `<div class="status">
        Keine Nachrichten gefunden.
      </div>`;

    return;

  }


  articles
    .slice(0, 8)
    .forEach(article => {

      top.appendChild(
        createArticle(
          article
        )
      );

    });


  articles.forEach(
    article => {

      news.appendChild(
        createArticle(
          article
        )
      );

    }
  );

}


async function loadNews() {

  try {

    const response =
      await fetch(
        "news.json?cache=" +
        Date.now()
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    allArticles =
      Array.isArray(
        data.articles
      )
        ? data.articles
        : [];


    if (data.updated) {

      document.getElementById(
        "updated"
      ).textContent =
        "Zuletzt aktualisiert: " +
        formatTime(
          data.updated
        );

    }


    render();


  } catch (error) {

    console.error(error);


    document.getElementById(
      "topNews"
    ).innerHTML =
      `<div class="status">
        Fehler beim Laden der Nachrichten.
      </div>`;


    document.getElementById(
      "news"
    ).innerHTML =
      `<div class="status">
        ${escapeHtml(
          error.message
        )}
      </div>`;

  }

}


/* REGION FILTER */

document
  .querySelectorAll(
    "#regionFilters button"
  )
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(
            "#regionFilters button"
          )
          .forEach(
            b =>
              b.classList.remove(
                "active"
              )
          );


        button.classList.add(
          "active"
        );


        selectedRegion =
          button.dataset.region;


        render();

      }
    );

  });


/* TOPIC FILTER */

document
  .querySelectorAll(
    "#topicFilters button"
  )
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(
            "#topicFilters button"
          )
          .forEach(
            b =>
              b.classList.remove(
                "active"
              )
          );


        button.classList.add(
          "active"
        );


        selectedTopic =
          button.dataset.topic;


        render();

      }
    );

  });


loadNews();


/* AUTOMATIC REFRESH */

setInterval(
  loadNews,
  30 * 60 * 1000
);

</script>

</body>

</html>
