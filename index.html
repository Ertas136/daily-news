<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daily News">

<title>Daily News</title>

<style>

:root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #17181a;
    --muted: #73777f;
    --border: #e1e4e8;
    --dark: #111827;
    --accent: #2563eb;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
}

header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(255,255,255,.96);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 16px;
}

.header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -.7px;
}

.updated {
    font-size: 11px;
    color: var(--muted);
    text-align: right;
}

.region-filter,
.topic-filter {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
}

.region-filter::-webkit-scrollbar,
.topic-filter::-webkit-scrollbar {
    display: none;
}

.region-filter {
    margin-top: 14px;
}

.topic-filter {
    margin-top: 10px;
}

.filter-btn {
    flex: 0 0 auto;
    border: 1px solid var(--border);
    background: white;
    color: var(--text);
    border-radius: 20px;
    padding: 8px 13px;
    font-size: 13px;
    cursor: pointer;
}

.filter-btn.active {
    background: var(--dark);
    color: white;
    border-color: var(--dark);
}

main {
    max-width: 950px;
    margin: 0 auto;
    padding: 20px 14px 60px;
}

.section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 5px 2px 12px;
}

.section-header h2 {
    margin: 0;
    font-size: 21px;
}

.section-header span {
    color: var(--muted);
    font-size: 12px;
}

.top-news {
    display: grid;
    gap: 12px;
    margin-bottom: 30px;
}

.news-grid {
    display: grid;
    gap: 11px;
}

.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.035);
}

.card.top {
    border-left: 4px solid var(--dark);
}

.badge {
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 7px;
}

.card h3 {
    margin: 0 0 8px;
    font-size: 17px;
    line-height: 1.3;
}

.card.top h3 {
    font-size: 19px;
}

.card p {
    margin: 0 0 13px;
    color: #555b63;
    font-size: 14px;
    line-height: 1.45;
}

.meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    color: var(--muted);
    font-size: 11px;
}

.source {
    font-weight: 700;
}

.read-more {
    display: inline-block;
    margin-top: 10px;
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
}

.status {
    background: white;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 25px;
    text-align: center;
    color: var(--muted);
}

.loading {
    font-size: 14px;
}

.error {
    color: #b42318;
}

footer {
    text-align: center;
    padding: 20px;
    color: var(--muted);
    font-size: 11px;
}

@media (min-width: 700px) {

    .top-news {
        grid-template-columns: repeat(2, 1fr);
    }

    .news-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    main {
        padding-top: 28px;
    }
}

</style>
</head>


<body>


<header>

    <div class="header-row">

        <div class="logo">
            Daily News
        </div>

        <div class="updated" id="updated">
            Lade Nachrichten …
        </div>

    </div>


    <div class="region-filter">

        <button class="filter-btn active" data-region="all">
            Alle
        </button>

        <button class="filter-btn" data-region="top">
            ⭐ Top News
        </button>

        <button class="filter-btn" data-region="local">
            📍 Ravensburg
        </button>

        <button class="filter-btn" data-region="regional">
            🏞️ Region
        </button>

        <button class="filter-btn" data-region="germany">
            🇩🇪 Deutschland
        </button>

        <button class="filter-btn" data-region="turkey">
            🇹🇷 Türkei
        </button>

        <button class="filter-btn" data-region="international">
            🌍 International
        </button>

    </div>


    <div class="topic-filter">

        <button class="filter-btn active" data-topic="all">
            Alle Themen
        </button>

        <button class="filter-btn" data-topic="politik">
            🏛️ Politik
        </button>

        <button class="filter-btn" data-topic="wirtschaft">
            💶 Wirtschaft
        </button>

        <button class="filter-btn" data-topic="sport">
            ⚽ Sport
        </button>

        <button class="filter-btn" data-topic="technologie">
            💻 Technologie
        </button>

        <button class="filter-btn" data-topic="gesellschaft">
            🌍 Gesellschaft
        </button>

        <button class="filter-btn" data-topic="wissenschaft">
            🔬 Wissenschaft
        </button>

    </div>

</header>


<main>


    <section id="topSection">

        <div class="section-header">

            <h2>⭐ Top News</h2>

            <span id="topCount"></span>

        </div>

        <div class="top-news" id="topNews">

            <div class="status loading">
                Lade aktuelle Nachrichten …
            </div>

        </div>

    </section>


    <section>

        <div class="section-header">

            <h2>Nachrichten</h2>

            <span id="resultCount"></span>

        </div>


        <div class="news-grid" id="newsList">

            <div class="status loading">
                Lade aktuelle Nachrichten …
            </div>

        </div>

    </section>


</main>


<footer>
    Daily News · automatisch aktualisiert
</footer>


<script>

let allNews = [];

let selectedRegion = "all";
let selectedTopic = "all";


const regionNames = {

    local: "📍 Ravensburg",
    regional: "🏞️ Region",
    germany: "🇩🇪 Deutschland",
    turkey: "🇹🇷 Türkei",
    international: "🌍 International"

};


const topicNames = {

    politik: "🏛️ Politik",
    wirtschaft: "💶 Wirtschaft",
    sport: "⚽ Sport",
    technologie: "💻 Technologie",
    gesellschaft: "🌍 Gesellschaft",
    wissenschaft: "🔬 Wissenschaft"

};


function cleanText(text) {

    if (!text) {
        return "";
    }

    const div = document.createElement("div");

    div.innerHTML = text;

    return div.textContent || div.innerText || "";

}


function shorten(text, maxLength = 240) {

    text = cleanText(text);

    if (text.length <= maxLength) {
        return text;
    }

    return text.substring(0, maxLength).trim() + "…";

}


function formatTime(dateString) {

    if (!dateString) {
        return "";
    }

    const date = new Date(dateString);

    if (isNaN(date.getTime())) {
        return dateString;
    }

    const now = new Date();

    const diffMinutes =
        Math.floor((now - date) / 60000);


    if (diffMinutes < 1) {
        return "gerade eben";
    }

    if (diffMinutes < 60) {
        return `vor ${diffMinutes} Min.`;
    }


    const diffHours =
        Math.floor(diffMinutes / 60);


    if (diffHours < 24) {
        return `vor ${diffHours} Std.`;
    }


    const diffDays =
        Math.floor(diffHours / 24);


    if (diffDays === 1) {
        return "gestern";
    }

    if (diffDays < 7) {
        return `vor ${diffDays} Tagen`;
    }


    return date.toLocaleDateString(
        "de-DE",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );

}


function getSourceName(article) {

    if (article.sourceName) {
        return article.sourceName;
    }

    if (article.source) {

        try {

            const url =
                new URL(article.source);

            return url.hostname
                .replace("www.", "");

        } catch {

            return article.source;

        }

    }

    return "Quelle";

}


function regionLabel(region) {

    return regionNames[region] || region || "";

}


function topicLabel(topic) {

    if (topicNames[topic]) {
        return topicNames[topic];
    }

    return "Nachricht";

}


function createCard(article, top = false) {

    const title =
        cleanText(article.title) ||
        "Ohne Titel";


    const summary =
        shorten(article.summary);


    const source =
        getSourceName(article);


    const time =
        formatTime(article.time);


    const region =
        regionLabel(article.region);


    const topic =
        topicLabel(article.topic);


    const link =
        article.link || "#";


    return `

        <article class="card ${top ? "top" : ""}">

            <div class="badge">
                ${region} · ${topic}
            </div>

            <h3>
                ${title}
            </h3>

            ${
                summary
                ? `<p>${summary}</p>`
                : ""
            }

            <div class="meta">

                <span class="source">
                    ${source}
                </span>

                <span>
                    ${time}
                </span>

            </div>

            ${
                link !== "#"
                ? `
                    <a
                        class="read-more"
                        href="${link}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        Artikel lesen →
                    </a>
                `
                : ""
            }

        </article>

    `;

}


function renderTopNews() {

    const container =
        document.getElementById("topNews");


    /*
      Zunächst verwenden wir die neuesten Meldungen
      als Top News.

      Später können wir hier eine echte
      Relevanzbewertung einbauen.
    */

    const top =
        [...allNews]
            .sort(
                (a,b) =>
                    new Date(b.time) -
                    new Date(a.time)
            )
            .slice(0, 8);


    document.getElementById("topCount")
        .textContent =
        `${top.length} Meldungen`;


    if (!top.length) {

        container.innerHTML = `

            <div class="status">
                Keine Top News verfügbar.
            </div>

        `;

        return;
    }


    container.innerHTML =
        top.map(article =>
            createCard(article, true)
        ).join("");

}


function renderNews() {

    const container =
        document.getElementById("newsList");


    let filtered =
        [...allNews];


    if (selectedRegion !== "all") {

        filtered =
            filtered.filter(
                article =>
                    article.region === selectedRegion
            );

    }


    if (selectedTopic !== "all") {

        filtered =
            filtered.filter(
                article =>
                    article.topic === selectedTopic
            );

    }


    filtered.sort(
        (a,b) =>
            new Date(b.time) -
            new Date(a.time)
    );


    document.getElementById("resultCount")
        .textContent =
        `${filtered.length} Meldungen`;


    if (!filtered.length) {

        container.innerHTML = `

            <div class="status">
                Keine Nachrichten für diese Auswahl.
            </div>

        `;

        return;
    }


    container.innerHTML =
        filtered
            .map(article =>
                createCard(article)
            )
            .join("");

}


async function loadNews() {

    try {

        const response =
            await fetch(
                "news.json?cache=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "news.json konnte nicht geladen werden."
            );

        }


        const data =
            await response.json();


        allNews =
            Array.isArray(data.articles)
            ? data.articles
            : [];


        document.getElementById("updated")
            .textContent =
            data.updated
            ? "Update: " +
              formatTime(data.updated)
            : "Aktuell";


        renderTopNews();

        renderNews();


    } catch (error) {

        console.error(error);


        document.getElementById("topNews")
            .innerHTML = `

                <div class="status error">

                    Nachrichten konnten nicht
                    geladen werden.

                </div>

            `;


        document.getElementById("newsList")
            .innerHTML = `

                <div class="status error">

                    Bitte später erneut versuchen.

                </div>

            `;

    }

}


document
    .querySelectorAll(
        ".region-filter .filter-btn"
    )
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(
                        ".region-filter .filter-btn"
                    )
                    .forEach(
                        btn =>
                            btn.classList
                               .remove("active")
                    );


                button.classList
                    .add("active");


                selectedRegion =
                    button.dataset.region;


                if (
                    selectedRegion === "top"
                ) {

                    document
                        .getElementById(
                            "topSection"
                        )
                        .scrollIntoView({
                            behavior: "smooth"
                        });

                    return;

                }


                renderNews();

            }
        );

    });


document
    .querySelectorAll(
        ".topic-filter .filter-btn"
    )
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(
                        ".topic-filter .filter-btn"
                    )
                    .forEach(
                        btn =>
                            btn.classList
                               .remove("active")
                    );


                button.classList
                    .add("active");


                selectedTopic =
                    button.dataset.topic;


                renderNews();

            }
        );

    });


loadNews();

</script>

</body>
</html>
