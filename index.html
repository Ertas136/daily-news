<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daily News">

<title>Daily News</title>

<style>
:root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #17181a;
    --muted: #70757d;
    --border: #e2e4e8;
    --accent: #111827;
    --active: #111827;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 18px 16px 14px;
    position: sticky;
    top: 0;
    z-index: 20;
}

.header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -0.5px;
}

.date {
    color: var(--muted);
    font-size: 13px;
}

.region-filter {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-top: 15px;
    scrollbar-width: none;
}

.region-filter::-webkit-scrollbar {
    display: none;
}

.region-btn,
.topic-btn {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    border-radius: 20px;
    padding: 8px 13px;
    white-space: nowrap;
    font-size: 14px;
    cursor: pointer;
}

.region-btn.active,
.topic-btn.active {
    background: var(--active);
    color: #fff;
    border-color: var(--active);
}

main {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 14px 50px;
}

.section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 5px 2px 12px;
}

.section-title h2 {
    margin: 0;
    font-size: 21px;
}

.section-title span {
    color: var(--muted);
    font-size: 13px;
}

.top-news {
    display: grid;
    gap: 12px;
    margin-bottom: 28px;
}

.top-card {
    background: var(--card);
    border-radius: 16px;
    padding: 17px;
    border: 1px solid var(--border);
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

.top-card .badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 8px;
}

.top-card h3 {
    margin: 0 0 8px;
    font-size: 19px;
    line-height: 1.25;
}

.top-card p {
    margin: 0 0 12px;
    color: #4f545b;
    font-size: 14px;
    line-height: 1.45;
}

.meta {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    color: var(--muted);
    font-size: 12px;
}

.news-controls {
    margin-bottom: 16px;
}

.topic-filter {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    scrollbar-width: none;
}

.topic-filter::-webkit-scrollbar {
    display: none;
}

.news-list {
    display: grid;
    gap: 10px;
}

.news-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 15px;
}

.news-card h3 {
    margin: 6px 0 7px;
    font-size: 17px;
    line-height: 1.3;
}

.news-card p {
    margin: 0 0 11px;
    color: #555b63;
    font-size: 14px;
    line-height: 1.45;
}

.news-card .badge {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
}

.source {
    font-weight: 600;
}

.empty {
    background: var(--card);
    border: 1px dashed var(--border);
    border-radius: 14px;
    padding: 25px;
    text-align: center;
    color: var(--muted);
}

footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 20px;
}

@media (min-width: 700px) {
    .top-news {
        grid-template-columns: repeat(2, 1fr);
    }

    .news-list {
        grid-template-columns: repeat(2, 1fr);
    }

    main {
        padding-top: 28px;
    }
}
</style>
</head>

<body>

<header>

    <div class="header-top">
        <div class="logo">Daily News</div>
        <div class="date" id="currentDate"></div>
    </div>

    <div class="region-filter">

        <button class="region-btn active" data-region="all">
            Alle
        </button>

        <button class="region-btn" data-region="top">
            ⭐ Top News
        </button>

        <button class="region-btn" data-region="local">
            📍 Ravensburg
        </button>

        <button class="region-btn" data-region="regional">
            🏞️ Region
        </button>

        <button class="region-btn" data-region="germany">
            🇩🇪 Deutschland
        </button>

        <button class="region-btn" data-region="turkey">
            🇹🇷 Türkei
        </button>

        <button class="region-btn" data-region="international">
            🌍 International
        </button>

    </div>

</header>


<main>

    <section id="topSection">

        <div class="section-title">
            <h2>⭐ Top News</h2>
            <span>Aktuell</span>
        </div>

        <div class="top-news" id="topNews"></div>

    </section>


    <section>

        <div class="section-title">
            <h2>Nachrichten</h2>
            <span id="resultCount"></span>
        </div>

        <div class="news-controls">

            <div class="topic-filter">

                <button class="topic-btn active" data-topic="all">
                    Alle
                </button>

                <button class="topic-btn" data-topic="politik">
                    🏛️ Politik
                </button>

                <button class="topic-btn" data-topic="wirtschaft">
                    💶 Wirtschaft
                </button>

                <button class="topic-btn" data-topic="sport">
                    ⚽ Sport
                </button>

                <button class="topic-btn" data-topic="technologie">
                    💻 Technologie
                </button>

                <button class="topic-btn" data-topic="gesellschaft">
                    🌍 Gesellschaft
                </button>

                <button class="topic-btn" data-topic="wissenschaft">
                    🔬 Wissenschaft
                </button>

            </div>

        </div>

        <div class="news-list" id="newsList"></div>

    </section>

</main>


<footer>
    Daily News · persönliche Nachrichtenübersicht
</footer>


<script>

const news = [

    {
        region: "local",
        topic: "gesellschaft",
        title: "Neue Entwicklungen in Ravensburg",
        summary: "Hier erscheint später automatisch eine aktuelle lokale Nachricht aus Ravensburg und dem Landkreis.",
        source: "Lokale Quelle",
        time: "vor 25 Min."
    },

    {
        region: "regional",
        topic: "wirtschaft",
        title: "Wirtschaft in Oberschwaben im Fokus",
        summary: "Aktuelle Entwicklungen aus Bodensee-Oberschwaben werden hier zusammengefasst.",
        source: "Regionale Quelle",
        time: "vor 40 Min."
    },

    {
        region: "germany",
        topic: "politik",
        title: "Aktuelle politische Entwicklungen in Deutschland",
        summary: "Hier werden später aktuelle Nachrichten aus Deutschland angezeigt.",
        source: "Deutsche Quelle",
        time: "vor 1 Std."
    },

    {
        region: "germany",
        topic: "wirtschaft",
        title: "Neue Entwicklungen in der deutschen Wirtschaft",
        summary: "Wichtige Wirtschaftsnews aus Deutschland erscheinen hier mit einer kurzen Zusammenfassung.",
        source: "Wirtschaftsquelle",
        time: "vor 1 Std."
    },

    {
        region: "turkey",
        topic: "politik",
        title: "Aktuelle Entwicklungen in der Türkei",
        summary: "Hier erscheinen später aktuelle Nachrichten aus der Türkei.",
        source: "Türkische Quelle",
        time: "vor 2 Std."
    },

    {
        region: "international",
        topic: "technologie",
        title: "Neue Entwicklungen in der Technologie",
        summary: "Internationale Technologie-News werden hier automatisch zusammengefasst.",
        source: "Tech Quelle",
        time: "vor 2 Std."
    },

    {
        region: "international",
        topic: "wissenschaft",
        title: "Neue internationale Forschungsergebnisse",
        summary: "Wissenschaftliche Entwicklungen aus aller Welt erscheinen in diesem Bereich.",
        source: "Wissenschaftsquelle",
        time: "vor 3 Std."
    },

    {
        region: "germany",
        topic: "sport",
        title: "Aktuelle Sportnachrichten",
        summary: "Hier werden später aktuelle Sportmeldungen aus Deutschland angezeigt.",
        source: "Sportquelle",
        time: "vor 3 Std."
    }

];


const topNews = [

    news[2],
    news[3],
    news[5],
    news[4]

];


let selectedRegion = "all";
let selectedTopic = "all";


function renderTopNews() {

    const container = document.getElementById("topNews");

    container.innerHTML = topNews.map(item => `

        <article class="top-card">

            <div class="badge">
                ${regionName(item.region)} · ${topicName(item.topic)}
            </div>

            <h3>${item.title}</h3>

            <p>${item.summary}</p>

            <div class="meta">
                <span class="source">${item.source}</span>
                <span>${item.time}</span>
            </div>

        </article>

    `).join("");

}


function renderNews() {

    const container = document.getElementById("newsList");

    let filtered = news.filter(item => {

        const regionMatch =
            selectedRegion === "all" ||
            item.region === selectedRegion;

        const topicMatch =
            selectedTopic === "all" ||
            item.topic === selectedTopic;

        return regionMatch && topicMatch;

    });


    document.getElementById("resultCount").textContent =
        filtered.length + " Meldungen";


    if (filtered.length === 0) {

        container.innerHTML = `
            <div class="empty">
                Keine Nachrichten für diese Auswahl.
            </div>
        `;

        return;
    }


    container.innerHTML = filtered.map(item => `

        <article class="news-card">

            <div class="badge">
                ${regionName(item.region)} · ${topicName(item.topic)}
            </div>

            <h3>${item.title}</h3>

            <p>${item.summary}</p>

            <div class="meta">
                <span class="source">${item.source}</span>
                <span>${item.time}</span>
            </div>

        </article>

    `).join("");

}


function regionName(region) {

    const names = {

        local: "📍 Ravensburg",
        regional: "🏞️ Region",
        germany: "🇩🇪 Deutschland",
        turkey: "🇹🇷 Türkei",
        international: "🌍 International"

    };

    return names[region] || "";

}


function topicName(topic) {

    const names = {

        politik: "🏛️ Politik",
        wirtschaft: "💶 Wirtschaft",
        sport: "⚽ Sport",
        technologie: "💻 Technologie",
        gesellschaft: "🌍 Gesellschaft",
        wissenschaft: "🔬 Wissenschaft"

    };

    return names[topic] || "";

}


document.querySelectorAll(".region-btn").forEach(button => {

    button.addEventListener("click", () => {

        document
            .querySelectorAll(".region-btn")
            .forEach(btn => btn.classList.remove("active"));

        button.classList.add("active");

        selectedRegion = button.dataset.region;

        if (selectedRegion === "top") {

            document.getElementById("topSection").scrollIntoView({
                behavior: "smooth"
            });

            return;
        }

        renderNews();

    });

});


document.querySelectorAll(".topic-btn").forEach(button => {

    button.addEventListener("click", () => {

        document
            .querySelectorAll(".topic-btn")
            .forEach(btn => btn.classList.remove("active"));

        button.classList.add("active");

        selectedTopic = button.dataset.topic;

        renderNews();

    });

});


document.getElementById("currentDate").textContent =
    new Date().toLocaleDateString("de-DE", {
        weekday: "short",
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
    });


renderTopNews();
renderNews();

</script>

</body>
</html>
