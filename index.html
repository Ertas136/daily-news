<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>

<title>Daily News</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: #f4f5f7;
  color: #111827;
}

header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid #ddd;
  padding: 16px;
}

h1 {
  margin: 0 0 14px 0;
  font-size: 28px;
}

.filters {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
}

button {
  border: 0;
  background: #e5e7eb;
  border-radius: 999px;
  padding: 9px 14px;
  font-size: 14px;
  white-space: nowrap;
  cursor: pointer;
}

button.active {
  background: #111827;
  color: white;
}

main {
  max-width: 1000px;
  margin: auto;
  padding: 18px;
}

.section-title {
  font-size: 22px;
  font-weight: 700;
  margin: 10px 0 14px;
}

.news-grid {
  display: grid;
  gap: 14px;
}

.article {
  background: white;
  border-radius: 16px;
  padding: 17px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

.article h2 {
  font-size: 19px;
  line-height: 1.3;
  margin: 0 0 9px;
}

.summary {
  font-size: 15px;
  line-height: 1.5;
  color: #4b5563;
  margin-bottom: 12px;
}

.meta {
  font-size: 12px;
  color: #6b7280;
  margin-bottom: 12px;
}

.tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.tag {
  background: #eef2ff;
  color: #374151;
  border-radius: 999px;
  padding: 4px 8px;
  font-size: 11px;
}

.article a {
  display: inline-block;
  text-decoration: none;
  background: #111827;
  color: white;
  padding: 9px 13px;
  border-radius: 9px;
  font-size: 13px;
}

.status {
  text-align: center;
  padding: 30px 10px;
  color: #6b7280;
}

@media (min-width: 700px) {
  .news-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

</style>
</head>

<body>

<header>

<h1>📰 Daily News</h1>

<div class="filters" id="regionFilters">

<button class="active" data-region="all">Alle</button>
<button data-region="local">📍 Ravensburg</button>
<button data-region="regional">🏞️ Region</button>
<button data-region="germany">🇩🇪 Deutschland</button>
<button data-region="turkey">🇹🇷 Türkei</button>
<button data-region="international">🌍 International</button>

</div>

<br>

<div class="filters" id="topicFilters">

<button class="active" data-topic="all">Alle Themen</button>
<button data-topic="politik">🏛️ Politik</button>
<button data-topic="wirtschaft">💶 Wirtschaft</button>
<button data-topic="sport">⚽ Sport</button>
<button data-topic="technologie">💻 Technologie</button>
<button data-topic="gesellschaft">🌍 Gesellschaft</button>
<button data-topic="wissenschaft">🔬 Wissenschaft</button>

</div>

</header>

<main>

<div class="section-title">⭐ Top News</div>

<div id="topNews" class="news-grid">
  <div class="status">Nachrichten werden geladen …</div>
</div>

<div class="section-title" style="margin-top:32px;">
  Alle Nachrichten
</div>

<div id="news" class="news-grid">
  <div class="status">Nachrichten werden geladen …</div>
</div>

</main>

<script>

let allArticles = [];

let selectedRegion = "all";
let selectedTopic = "all";


function formatTime(dateString) {

  if (!dateString) return "";

  const date = new Date(dateString);

  if (isNaN(date)) return dateString;

  return new Intl.DateTimeFormat(
    "de-DE",
    {
      dateStyle: "short",
      timeStyle: "short"
    }
  ).format(date);

}


function createArticle(article) {

  const div = document.createElement("article");

  div.className = "article";

  const title =
    article.title || "Ohne Titel";

  const summary =
    article.summary || "";

  const source =
    article.sourceName || "Unbekannte Quelle";

  const region =
    article.region || "";

  const topic =
    article.topic || "";

  div.innerHTML = `

    <h2>${escapeHtml(title)}</h2>

    <div class="summary">
      ${escapeHtml(cleanSummary(summary))}
    </div>

    <div class="tags">

      ${
        region
          ? `<span class="tag">${escapeHtml(region)}</span>`
          : ""
      }

      ${
        topic
          ? `<span class="tag">${escapeHtml(topic)}</span>`
          : ""
      }

    </div>

    <div class="meta">

      ${escapeHtml(source)}

      ${article.time ? " · " + escapeHtml(formatTime(article.time)) : ""}

    </div>

    <a
      href="${escapeAttribute(article.link)}"
      target="_blank"
      rel="noopener noreferrer"
    >
      Originalartikel öffnen →
    </a>

  `;

  return div;

}


function cleanSummary(text) {

  const temp = document.createElement("div");

  temp.innerHTML = text || "";

  return temp.textContent || temp.innerText || "";

}


function escapeHtml(text) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function escapeAttribute(text) {

  return String(text || "")
    .replaceAll("&", "&amp;")
    .replaceAll('"', "&quot;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");

}


function getFilteredArticles() {

  return allArticles.filter(article => {

    const regionOK =
      selectedRegion === "all" ||
      article.region === selectedRegion;

    const topicOK =
      selectedTopic === "all" ||
      article.topic === selectedTopic;

    return regionOK && topicOK;

  });

}


function render() {

  const filtered =
    getFilteredArticles();

  const topNews =
    document.getElementById("topNews");

  const news =
    document.getElementById("news");


  topNews.innerHTML = "";

  news.innerHTML = "";


  if (!filtered.length) {

    topNews.innerHTML =
      `<div class="status">
        Keine Nachrichten für diesen Filter.
      </div>`;

    news.innerHTML =
      `<div class="status">
        Keine Nachrichten für diesen Filter.
      </div>`;

    return;

  }


  filtered
    .slice(0, 8)
    .forEach(article => {

      topNews.appendChild(
        createArticle(article)
      );

    });


  filtered.forEach(article => {

    news.appendChild(
      createArticle(article)
    );

  });

}


async function loadNews() {

  try {

    const response =
      await fetch(
        "news.json?cache=" + Date.now()
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " + response.status
      );

    }


    const data =
      await response.json();


    console.log("News geladen:", data);


    allArticles =
      Array.isArray(data.articles)
        ? data.articles
        : [];


    render();


  } catch (error) {

    console.error(
      "Fehler beim Laden der News:",
      error
    );


    document.getElementById("topNews").innerHTML =
      `<div class="status">
        Fehler beim Laden der Nachrichten.<br>
        Bitte Seite neu laden.
      </div>`;


    document.getElementById("news").innerHTML =
      `<div class="status">
        ${escapeHtml(error.message)}
      </div>`;

  }

}


document
  .querySelectorAll("#regionFilters button")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll("#regionFilters button")
          .forEach(b =>
            b.classList.remove("active")
          );

        button.classList.add("active");

        selectedRegion =
          button.dataset.region;

        render();

      }
    );

  });


document
  .querySelectorAll("#topicFilters button")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll("#topicFilters button")
          .forEach(b =>
            b.classList.remove("active")
          );

        button.classList.add("active");

        selectedTopic =
          button.dataset.topic;

        render();

      }
    );

  });


loadNews();

</script>

</body>
</html>
